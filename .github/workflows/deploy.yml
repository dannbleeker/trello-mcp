# Continuous deployment for trello-mcp.
#
# Deploys the Worker to Cloudflare on every push to main, after re-running
# the same type-check + test gate as CI (belt and braces: a deploy should
# never outrun a red suite, even if CI is skipped or raced).
#
# Auth: the CLOUDFLARE_API_TOKEN repository secret (Actions → Secrets),
# created from Cloudflare's "Edit Cloudflare Workers" token template.
# Worker secrets (TRELLO_*, GITHUB_*, COOKIE_ENCRYPTION_KEY) live in
# Cloudflare, not here — `wrangler deploy` never touches them.
#
# workflow_dispatch allows a manual deploy of any ref (used for the
# first-run verification of the token; occasionally handy for rollbacks
# by dispatching an older tag/branch).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Deploys must not interleave; let an in-flight deploy finish.
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm type-check

      - name: Vitest unit tests
        run: pnpm test

      - name: Verify Cloudflare token
        run: pnpm exec wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
