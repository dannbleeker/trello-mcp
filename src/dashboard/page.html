<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dann — To-Do Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f6f7f9;
  color: #1c2024;
  font-size: 14px;
  line-height: 1.45;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

/* ---- Health bar ---- */
.health {
  background: #fff;
  border: 1px solid #e4e7eb;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.health-top { display: flex; flex-wrap: wrap; gap: 22px; align-items: baseline; margin-bottom: 12px; }
.stat { display: flex; flex-direction: column; }
.stat .num { font-size: 26px; font-weight: 700; line-height: 1; }
.stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin-top: 4px; }
.stat .num.alert { color: #c0392b; }
.wip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.wip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 5px 10px; border-radius: 999px;
  background: #eef1f4; border: 1px solid #e0e4e8;
}
.wip b { font-weight: 600; }
.wip.ok { background: #ecf7ee; border-color: #cfe9d4; }
.wip.over { background: #fdecea; border-color: #f5c6c0; color: #a5281c; }
.wip .dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
.wip.over .dot { background: #c0392b; }
.wip.none .dot { background: #9aa3ad; }

/* ---- Zones ---- */
.zone-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #4b5563; margin: 22px 0 10px; }
.zone-title small { font-weight: 500; text-transform: none; letter-spacing: 0; color: #9aa3ad; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip {
  font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  background: #fff; border: 1px solid #d7dbe0; color: #374151; user-select: none;
}
.chip.active { background: #1c2024; color: #fff; border-color: #1c2024; }

.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.col {
  background: #fff; border: 1px solid #e4e7eb; border-radius: 12px;
  padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); min-width: 0;
}
.col-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.col-head .name { font-weight: 600; font-size: 13px; }
.col-head .count { font-size: 11px; color: #6b7280; background:#eef1f4; border-radius:999px; padding:2px 8px; }
.col-head .count.over { background:#fdecea; color:#a5281c; }

.card {
  border: 1px solid #eceef1; border-radius: 9px; padding: 9px 10px; margin-bottom: 8px;
  background: #fcfcfd;
}
.card:last-child { margin-bottom: 0; }
.card .ttl { font-size: 13px; font-weight: 500; }
.card .ttl a { color: inherit; text-decoration: none; }
.card .ttl a:hover { text-decoration: underline; }
.card .desc { font-size: 11.5px; color: #6b7280; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.badge.bestseller { background:#1c2024; color:#fff; }
.badge.invest { background:#2563eb; color:#fff; }
.badge.clarify { background:#fdecea; color:#c0392b; border:1px solid #f5c6c0; }
/* Every OTHER board label renders from its own Trello colour, so a label added
   in Trello appears here without a code change (the three above keep their
   hand-tuned look). Trello's palette also has _light / _dark variants of each
   hue; they collapse onto the base hue — a 10px pill can't carry three shades
   of green and stay legible. Solid fills, so no dark-mode override is needed:
   the contrast lives inside the pill, not against the card. */
.badge.lbl-green  { background:#4bce97; color:#164b35; }
.badge.lbl-yellow { background:#f5cd47; color:#533f04; }
.badge.lbl-orange { background:#fea362; color:#702e00; }
.badge.lbl-red    { background:#f87168; color:#5d1f1a; }
.badge.lbl-purple { background:#9f8fef; color:#352c63; }
.badge.lbl-blue   { background:#579dff; color:#09326c; }
.badge.lbl-sky    { background:#6cc3e0; color:#164555; }
.badge.lbl-lime   { background:#94c748; color:#37471f; }
.badge.lbl-pink   { background:#e774bb; color:#50253f; }
.badge.lbl-black  { background:#8590a2; color:#091e42; }
.badge.lbl-none   { background:#dcdfe4; color:#44546f; }
/* Custom-field values: deliberately quieter than the label badges — they are
   data ABOUT the card, not a flag on it, so they must not outrank "overdue". */
.badge.cfield { background:#eef1f4; color:#4b5563; border:1px solid #dde2e8; }
/* Big-rock age. A rock nobody has touched in months is the exact failure this
   zone exists to prevent, so past a quarter it gets the same red as an overdue
   card; a month is a nudge, not an alarm. */
.badge.age { background:#eef1f4; color:#4b5563; border:1px solid #dde2e8; }
.badge.age.drifting { background:#fef4e6; color:#8a5a00; border-color:#f5dcb3; }
.badge.age.buried { background:#fdecea; color:#c0392b; border-color:#f5c6c0; }
.card-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.btn {
  font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
  border: 1px solid #d7dbe0; background: #fff; color: #374151;
}
.btn:hover { background: #f3f4f6; }
.btn.done { border-color: #cfe9d4; color: #1a7f37; }
.btn.done:hover { background: #ecf7ee; }
.btn:disabled { opacity: .5; cursor: default; }
select.mv { font-size: 11px; padding: 3px 6px; border-radius: 6px; border: 1px solid #d7dbe0; background:#fff; color:#374151; max-width: 120px; }

.empty { font-size: 12px; color: #9aa3ad; font-style: italic; padding: 4px 2px; }

/* snoozed expandable panel */
.stat.click { cursor: pointer; user-select: none; }
.stat.click:hover .lbl { color: #1c2024; }
.snz-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border: 1px solid #eceef1; border-radius: 9px; padding: 8px 10px; margin-bottom: 8px;
  background: #fcfcfd; font-size: 13px;
}
.snz-row .meta { font-size: 11px; color: #6b7280; white-space: nowrap; }
.snz-row .meta.overdue { color: #a5281c; font-weight: 600; }

/* list overview panel */
.ov-panel {
  background: #fff; border: 1px solid #e4e7eb; border-radius: 12px;
  padding: 12px 14px 14px; margin: 18px 0 6px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.ov-panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin-bottom: 10px; }
.ov-panel-title small { font-weight: 500; text-transform: none; letter-spacing: 0; color: #9aa3ad; }
.ov-panel-title.click { cursor: pointer; user-select: none; }
.ov-panel-title.click:hover { color: #1c2024; }
.rev-sub { font-size: 12px; font-weight: 600; color: #4b5563; margin: 12px 0 8px; }
/* Collapsed, the panel is just its own title — don't reserve body space. */
.ov-panel.collapsed { padding-bottom: 12px; }
.ov-panel.collapsed .ov-panel-title { margin-bottom: 0; }
/* A horizon holding nothing is information too — dimmed, not hidden. */
.wip.zero { opacity: .5; }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.ov {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #f6f7f9; border: 1px solid #eceef1; border-radius: 10px; padding: 10px 6px;
  text-align: center;
}
.ov .ov-num { font-size: 22px; font-weight: 700; line-height: 1; color: #1c2024; }
.ov .ov-name { font-size: 10.5px; color: #6b7280; margin-top: 5px; line-height: 1.2; }
.ov.zero { opacity: .5; }
.ov.alert { background: #fdecea; border-color: #f5c6c0; }
.ov.alert .ov-num { color: #c0392b; }
.chip-n { opacity: .55; font-weight: 700; margin-left: 3px; }
.chip.active .chip-n { opacity: .85; }

/* capture */
.capture { display: flex; gap: 8px; margin: 4px 0 4px; }
.capture input {
  flex: 1; font-size: 13px; padding: 8px 11px; border-radius: 8px; border: 1px solid #d7dbe0; background:#fff;
}
.capture button {
  font-size: 13px; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
  background: #1c2024; color: #fff; font-weight: 600;
}
.capture button:disabled { opacity: .5; cursor: default; }

#toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: #1c2024; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
}
#toast.show { opacity: 1; }
.loading { padding: 40px; text-align: center; color: #6b7280; }
.errbox { background:#fdecea; border:1px solid #f5c6c0; color:#a5281c; padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }

/* due badges */
.badge.duover { background:#fdecea; color:#c0392b; border:1px solid #f5c6c0; }
.badge.dueto  { background:#1c2024; color:#fff; }

/* ---- touch devices (v1.20.0) ----
   Dann travels ~30% and drives this from a phone as an installed PWA, where
   the desktop sizes are genuinely hard to hit: ✓ Done and Move are 11px with
   3px of padding. Gated on `pointer: coarse` rather than a width breakpoint,
   so a narrow desktop window keeps the compact layout and a large tablet
   still gets the big targets. The 16px on the capture input is not cosmetic —
   iOS Safari auto-zooms the page on focusing any input below 16px, which on
   the one screen Dann uses to capture a thought is actively hostile. */
@media (pointer: coarse) {
  /* ~44px tall, the smallest reliable touch target. */
  .btn { font-size: 14px; padding: 13px 16px; }
  select.mv { font-size: 14px; padding: 12px 10px; max-width: 150px; }
  .chip { font-size: 14px; padding: 12px 16px; }
  .card { padding: 12px; }
  .card-actions { gap: 10px; margin-top: 10px; }
  .capture input { font-size: 16px; padding: 12px 14px; }
  .capture button { font-size: 15px; padding: 12px 20px; }
  .stat.click, .ov-panel-title.click { padding: 4px 0; }
}

/* Captures held back while offline — shown under the capture box so a queued
   thought is never silently invisible. */
.cap-queued { font-size: 11.5px; color: #8a5a00; background: #fef4e6; border: 1px solid #f5dcb3;
  border-radius: 8px; padding: 6px 10px; margin: -2px 0 8px; }

/* ---- dark mode (v1.16.0) ---- */
@media (prefers-color-scheme: dark) {
  body { background: #15171a; color: #e5e7eb; }
  .health, .col, .ov-panel { background: #1e2124; border-color: #2a2e33; box-shadow: none; }
  .card, .snz-row { background: #24272b; border-color: #2e3237; }
  .card .desc, .stat .lbl, .zone-title small, .ov .ov-name, .snz-row .meta, .col-head .count, .ov-panel-title { color: #9aa3ad; }
  .zone-title { color: #9aa3ad; }
  .stat .num.alert { color: #f87171; }
  .chip { background: #1e2124; border-color: #3a3f45; color: #d1d5db; }
  .chip.active { background: #e5e7eb; color: #15171a; border-color: #e5e7eb; }
  .wip { background: #24272b; border-color: #2e3237; color: #d1d5db; }
  .wip.ok { background: #14321c; border-color: #1d4a29; }
  .wip.over { background: #3b1512; border-color: #5c221c; color: #f2b8b5; }
  .col-head .count { background: #2a2e33; }
  .col-head .count.over { background: #3b1512; color: #f2b8b5; }
  .btn, select.mv { background: #24272b; border-color: #3a3f45; color: #d1d5db; }
  .btn:hover { background: #2e3237; }
  .btn.done { color: #4ade80; border-color: #1d4a29; }
  .btn.done:hover { background: #14321c; }
  .capture input { background: #1e2124; border-color: #3a3f45; color: #e5e7eb; }
  .capture button { background: #e5e7eb; color: #15171a; }
  .ov { background: #24272b; border-color: #2e3237; }
  .ov .ov-num { color: #e5e7eb; }
  .ov.alert { background: #3b1512; border-color: #5c221c; }
  .ov.alert .ov-num { color: #f2b8b5; }
  .badge.clarify, .badge.duover { background: #3b1512; color: #f2b8b5; border-color: #5c221c; }
  .snz-row .meta.overdue { color: #f2b8b5; }
  .badge.dueto { background: #e5e7eb; color: #15171a; }
  .badge.bestseller { background: #e5e7eb; color: #15171a; }
  .badge.cfield { background: #23262b; color: #9aa3ad; border-color: #33373d; }
  .badge.age { background: #23262b; color: #9aa3ad; border-color: #33373d; }
  .badge.age.drifting { background: #3a2a10; color: #f0c68a; border-color: #5c451c; }
  .badge.age.buried { background: #3b1512; color: #f2b8b5; border-color: #5c221c; }
  .ov-panel-title.click:hover { color: #e5e7eb; }
  .rev-sub { color: #d1d5db; }
  .cap-queued { background: #3a2a10; color: #f0c68a; border-color: #5c451c; }
  #toast { background: #e5e7eb; color: #15171a; }
  .errbox { background: #3b1512; border-color: #5c221c; color: #f2b8b5; }
  .loading, .empty { color: #9aa3ad; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="content"><div class="loading">Loading your board…</div></div>
</div>
<div id="toast"></div>

<script>
// Data layer talks to the same-origin Worker API (see src/dashboard/handler.ts).
// Auth is a GitHub-OAuth session cookie; a 401 bounces the browser to /app/login.
// ---- Board layout, read off the board itself (v1.20.0) ----
// This used to be a hardcoded board ID, five context list IDs and their WIP
// limits. A list added in Trello never appeared here, and a WIP limit changed
// in Trello made the dashboard quietly lie. /api/cards now returns the board's
// lists and the layout is derived from them on every load.
//
// Deriving the layout must NOT become "show every list". Exactly two things
// qualify, and nothing else is rendered:
//   * contexts — lists whose name starts with "@" (the board's own convention),
//     in board order, WIP parsed from the "(WIP limit N)" suffix that the tools
//     layer already reads for its guard warnings;
//   * the four named roles below.
// So Could-do (*), Someday maybe, Repeater Cards, Butler and Behind the scenes
// stay off the dashboard exactly as they were — but a renamed WIP limit, or a
// context list added or retired, now travels on its own.
const ROLES = [
  { key:"inbox",    match:/^inbox$/i,             label:"Inbox" },
  { key:"waiting",  match:/^waiting for/i,        label:"Waiting for…" },
  { key:"done",     match:/^done-do$/i,           label:"Done-do" },
  { key:"bigrocks", match:/^rolling big rocks$/i, label:"Rolling Big Rocks" },
];

// The dashboard follows its own ?board= (alias, name, raw ID or Trello URL —
// the same reference syntax the tools take). Absent, the server picks the
// default board, so the page no longer needs to know which board that is.
const BOARD_PARAM = new URLSearchParams(location.search || "").get("board");

let CTX = [];
// A role missing from this board resolves to a null id. cardsIn(null) is empty,
// so its zone renders as "clear" instead of throwing.
let INBOX    = { id:null, name:"Inbox" };
let WAITING  = { id:null, name:"Waiting for…" };
let DONE     = { id:null, name:"Done-do" };
let BIGROCKS = { id:null, name:"Rolling Big Rocks" };
let MOVE_TARGETS = [];
let OVERVIEW = [];
let LIST_NAMES = {};

function wipFromName(n){ const m = /\(WIP limit (\d+)\)/i.exec(n||""); return m ? Number(m[1]) : null; }
/** "@Computer (WIP limit 7)" -> "@Computer" — the limit is shown as a count, not in the title. */
function listLabel(n){ return (n||"").replace(/\s*\(WIP limit \d+\)\s*/i, "").trim(); }

function configureFromLists(lists){
  const open = (lists||[]).filter(l => l && !l.closed);
  CTX = open
    .filter(l => listLabel(l.name).startsWith("@"))
    .map(l => ({ id:l.id, name:listLabel(l.name), wip:wipFromName(l.name) }));
  const byKey = {};
  ROLES.forEach(r => {
    const hit = open.find(l => r.match.test(listLabel(l.name)));
    byKey[r.key] = { id: hit ? hit.id : null, name: r.label };
  });
  INBOX = byKey.inbox; WAITING = byKey.waiting; DONE = byKey.done; BIGROCKS = byKey.bigrocks;
  // Done is the ✓ button rather than a move target, and big rocks are read-only
  // server-side — move_card refuses them either way. Unresolved roles drop out.
  MOVE_TARGETS = CTX.concat([WAITING]).filter(l => l.id);
  OVERVIEW = CTX.concat([WAITING, INBOX]).filter(l => l.id);
  LIST_NAMES = {};
  CTX.concat([WAITING, INBOX, BIGROCKS, DONE]).forEach(l => { if (l.id) LIST_NAMES[l.id] = l.name; });
}

let CARDS = [];
let CUSTOM_FIELDS = [];    // board's custom-field definitions, by id (v1.18.0)
let SNOOZED = null;        // null = not loaded yet; [] = loaded, none
let SNOOZE_OPEN = false;
let REVIEW = null;         // weekly_review_pack payload; null = not loaded
// The weekly review is a Friday practice, so the panel opens itself on Fridays
// and stays a one-line strip the rest of the week — available when Dann is
// travelling and reviews on a different day, invisible when he isn't.
let REVIEW_OPEN = new Date().getDay() === 5;
const DAY_NAME = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];

// Horizon aliases as weekly_review_pack returns them → their board names. An
// alias with no entry falls back to itself, so a Could-do list added later
// still shows up (with a uglier label) rather than disappearing.
const HORIZON_NAMES = {
  "could-personal":   "Could-do (Personal)",
  "could-bestseller": "Could-do (BESTSELLER)",
  "could-dbp-invest": "Could-do (DBP Invest)",
  "could-ssf":        "Could-do (SSF)",
  "someday":          "Someday maybe",
};
let FILTER = (function(){ try { return localStorage.getItem("dann_dash_filter") || "all"; } catch(e){ return "all"; } })();

function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Thin same-origin fetch helper. 401 -> the session expired/absent, so send the
// browser to the GitHub login. Other non-2xx -> surface the server's {error}.
async function api(path, opts){
  const r = await fetch(path, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts || {}));
  if (r.status === 401){ location.href = "/app/login"; throw new Error("Not signed in"); }
  if (!r.ok){ let m = "Request failed"; try { m = (await r.json()).error || m; } catch(e){} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}

// Fetch + normalise the board. The API returns {cards:[...]} with Trello-native
// idList; normalise defensively so the rest of the dashboard is unchanged.
let LAST_LOAD = 0;
async function loadCards(){
  const res = await api("/api/cards?customFields=1" + (BOARD_PARAM ? "&board=" + encodeURIComponent(BOARD_PARAM) : ""));
  let arr = Array.isArray(res) ? res : (res && Array.isArray(res.cards)) ? res.cards : [];
  // Definitions arrive alongside the cards. A board with the Power-Up off (or
  // no fields defined) yields [], and every custom-field branch below no-ops.
  CUSTOM_FIELDS = (res && Array.isArray(res.customFields)) ? res.customFields : [];
  // Re-derived on every load, not just the first: a list renamed or a WIP limit
  // changed in Trello shows up on the next refresh without a redeploy.
  if (res && Array.isArray(res.lists)) configureFromLists(res.lists);
  LAST_LOAD = Date.now();
  return arr.map(c => ({ ...c, idList: (c.listId != null ? c.listId : c.idList) }));
}

// Render a card's custom-field values as badges. Only fields that actually
// have a value on this card appear — an empty field is noise on a board view.
// Mirrors the tool layer: "true"/"false" and numbers arrive as strings, and a
// list value is an option reference that has to be resolved to its label.
function customFieldBadges(c){
  if (!CUSTOM_FIELDS.length) return "";
  const items = c.customFieldItems || [];
  if (!items.length) return "";
  const byId = {};
  CUSTOM_FIELDS.forEach(f => { byId[f.id] = f; });
  let h = "";
  items.forEach(it => {
    const f = byId[it.idCustomField];
    if (!f) return;                       // definition deleted mid-flight
    let v = null;
    if (it.idValue){
      const opt = (f.options || []).find(o => o.id === it.idValue);
      v = opt && opt.value ? opt.value.text : null;
    } else if (it.value){
      if (typeof it.value.checked === "string") v = it.value.checked === "true" ? "yes" : "no";
      else if (it.value.text) v = it.value.text;
      else if (it.value.number) v = it.value.number;
      else if (it.value.date) v = new Date(it.value.date).toLocaleDateString("en-GB", {day:"numeric",month:"short"});
    }
    if (v === null || v === undefined || v === "") return;
    h += '<span class="badge cfield">' + esc(f.name) + ' · ' + esc(String(v)) + '</span>';
  });
  return h;
}

// toast(msg) or toast(msg, {label:"Undo", fn}) — the action variant stays up
// longer and is clickable.
function toast(msg, action){
  const t = document.getElementById("toast");
  t.innerHTML = esc(msg) + (action
    ? ' <button id="toastBtn" class="btn" style="margin-left:10px;">'+esc(action.label)+'</button>'
    : "");
  if (action){
    t.style.pointerEvents = "auto";
    document.getElementById("toastBtn").onclick = () => {
      t.classList.remove("show"); t.style.pointerEvents = "none";
      action.fn();
    };
  } else {
    t.style.pointerEvents = "none";
  }
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.classList.remove("show"); t.style.pointerEvents = "none"; }, action ? 6000 : 2200);
}

function cardsIn(listId){ return CARDS.filter(c => c.idList === listId && !isDivider(c)); }
function isDivider(c){ return /^-+$/.test((c.name||"").trim()); }
function hasLabel(c, n){ return (c.labels||[]).some(l => (typeof l === "string" ? l : l.name) === n); }

// Labels that keep a hand-tuned badge; `text` shortens a name that would
// otherwise dominate the row. Everything NOT listed here still renders — from
// its Trello colour — which is the point: the dashboard used to hardcode these
// three and silently drop every other label a card carried.
const LABEL_STYLES = {
  "BESTSELLER":                  { cls:"bestseller" },
  "DBP Invest":                  { cls:"invest" },
  "Please Clarify and Organize": { cls:"clarify", text:"clarify" },
};
const LABEL_HUES = ["green","yellow","orange","red","purple","blue","sky","lime","pink","black"];

// "green_dark" / "green_light" → "green"; unknown or absent colour → "none".
function labelHue(color){
  const base = String(color||"").split("_")[0];
  return LABEL_HUES.indexOf(base) >= 0 ? base : "none";
}

// Every label on the card, in the order Trello returns them (board order).
function labelBadges(c){
  return (c.labels||[]).map(l => {
    const name  = typeof l === "string" ? l : (l.name || "");
    const color = typeof l === "string" ? "" : (l.color || "");
    const hand  = LABEL_STYLES[name];
    if (hand) return '<span class="badge '+hand.cls+'">'+esc(hand.text || name)+'</span>';
    // Trello allows a colour with no name. Render the pill anyway (titled with
    // the colour) instead of dropping the label off the card entirely.
    return '<span class="badge lbl-'+labelHue(color)+'" title="'+esc(name || color || "label")+'">'
      + esc(name || "·") + '</span>';
  }).join("");
}

// Overdue / due-today badge from the browser's local day (same signal as the
// digest's due section, now visible on the live board too). v1.16.0.
function dueBadge(c){
  if (!c.due || c.dueComplete) return "";
  const t = new Date(c.due), now = new Date();
  const sameDay = t.getFullYear()===now.getFullYear() && t.getMonth()===now.getMonth() && t.getDate()===now.getDate();
  if (sameDay) return '<span class="badge dueto">today '+t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+'</span>';
  if (t < now){
    const opts = t.getFullYear() !== now.getFullYear()
      ? {day:"numeric",month:"short",year:"numeric"} // year shown when it differs (digest parity)
      : {day:"numeric",month:"short"};
    return '<span class="badge duover">overdue · '+t.toLocaleDateString("en-GB",opts)+'</span>';
  }
  return "";
}

/** Milliseconds of a card's last activity; unknown sorts last, not stalest. */
function activityMs(c){ const t = Date.parse((c && c.dateLastActivity) || ""); return isNaN(t) ? Infinity : t; }

// How long since anything happened on a card. No card on this board carries a
// due date — staleness is the signal Dann actually manages by, and the one his
// weekly review already runs on.
//
// Zones rot at different speeds, so a single threshold can't serve them:
//   rock    — big rocks are quarterly goals. Rolling one over is fine, but it
//             should be looked at every quarter at the very least, so 90 days
//             is the amber and a month past that is the alarm. Their age is
//             ALWAYS shown, whatever it is: it is the zone's only signal.
//   waiting — delegated and silent for ten days wants a chase.
//   inbox   — an item sitting uncaptured for a week means Get Clear isn't
//             happening; three weeks means the inbox has become storage.
//   next    — a next action surviving one weekly review untouched is normal.
//             Surviving four is rot, not a backlog.
// Everywhere but big rocks the badge stays invisible until it has something to
// say, so a healthy board shows none of these at all. v1.20.0.
const AGE_RULES = {
  rock:    { always:true,  drift:90, bury:120 },
  waiting: { always:false, drift:10, bury:21  },
  inbox:   { always:false, drift:7,  bury:21  },
  next:    { always:false, drift:14, bury:30  },
};

function ageBadge(c, kind){
  const rule = AGE_RULES[kind];
  if (!rule) return "";
  const t = activityMs(c);
  if (t === Infinity) return "";
  const days = Math.floor((Date.now() - t) / 86400000);
  if (days < rule.drift && !rule.always) return "";
  if (days < 1) return '<span class="badge age">touched today</span>';
  const txt = days < 14 ? days + (days === 1 ? " day" : " days")
            : days < 60 ? Math.floor(days/7) + " weeks"
            : Math.floor(days/30) + " months";
  const cls = days >= rule.bury ? "age buried" : days >= rule.drift ? "age drifting" : "age";
  return '<span class="badge '+cls+'">untouched '+txt+'</span>';
}

function badgesHtml(c, opts){
  let h = dueBadge(c);
  if (opts && opts.age) h += ageBadge(c, opts.age);
  h += labelBadges(c);
  h += customFieldBadges(c);
  return h ? '<div class="badges">'+h+'</div>' : "";
}

function descSnippet(c){
  let d = (c.desc||"");
  // Trello descriptions come back as Markdown — strip it down to readable text:
  d = d.replace(/!\[[^\]]*\]\([^)]*\)/g, "")                 // images
       .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")              // links -> link text
       .replace(/[*_`#>~]/g, "")                             // md emphasis/heading/quote marks
       .replace(/‌|​/g, "")                        // zero-width chars
       .replace(/\s+/g, " ")
       .trim();
  if (!d) return "";
  if (d.length > 90) d = d.slice(0,90) + "…";
  return '<div class="desc" title="'+esc((c.desc||"").replace(/\s+/g," ").trim())+'">'+esc(d)+'</div>';
}

function moveSelect(c){
  let opts = '<option value="">Move…</option>';
  MOVE_TARGETS.forEach(t => { if (t.id !== c.idList) opts += '<option value="'+t.id+'">'+esc(t.name)+'</option>'; });
  return '<select class="mv" data-card="'+c.id+'" onchange="onMove(this)">'+opts+'</select>';
}

function cardHtml(c, opts){
  opts = opts || {};
  // Only link http(s) URLs — mirrors the server's sanitizeUrl scheme whitelist.
  const link = (c.url && /^https?:\/\//i.test(c.url)) ? '<a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.name)+'</a>' : esc(c.name);
  let actions = "";
  if (!opts.noActions){
    actions = '<div class="card-actions">'
      + '<button class="btn done" data-card="'+c.id+'" onclick="onDone(this)">✓ Done</button>'
      + moveSelect(c)
      + '</div>';
  }
  return '<div class="card" data-card="'+c.id+'">'
    + '<div class="ttl">'+link+'</div>'
    + descSnippet(c)
    + badgesHtml(c, opts)
    + actions
    + '</div>';
}

// The label chips above "Next actions", in display order. `key` is what gets
// persisted to localStorage, so renaming one silently resets that browser's
// filter to All — add rather than rename. "Personal" is the residual (a card
// in none of these spheres) and "All" is everything, so both are derived from
// this list rather than spelled out: adding a chip here narrows Personal by
// the same stroke. A card in two spheres counts under both, as it always has.
const FILTER_LABELS = [
  { key:"bestseller", label:"BESTSELLER" },
  { key:"invest",     label:"DBP Invest" },
  { key:"ssf",        label:"SSF" },
];
function isPersonal(c){ return FILTER_LABELS.every(f => !hasLabel(c, f.label)); }

function passesFilter(c){
  if (FILTER === "all") return true;
  if (FILTER === "personal") return isPersonal(c);
  const f = FILTER_LABELS.find(f => f.key === FILTER);
  // Unknown key (a filter persisted by an older build) falls back to showing
  // everything rather than an unexplained empty board.
  return f ? hasLabel(c, f.label) : true;
}

function render(){
  // render() rebuilds #content wholesale — preserve any half-typed capture
  // text (and focus) so clicking a filter chip or ✓ Done doesn't wipe it.
  const prevInput = document.getElementById("capInput");
  const pendingCapture = prevInput ? prevInput.value : "";
  const captureHadFocus = prevInput && document.activeElement === prevInput;

  const inboxCards = cardsIn(INBOX.id);
  const waitingCards = cardsIn(WAITING.id);
  // Stalest first. A buried rock drifts to the bottom of the Trello list, which
  // is the one place it will never be noticed — so the dashboard inverts that.
  const rockCards = cardsIn(BIGROCKS.id).slice().sort((a,b) => activityMs(a) - activityMs(b));
  const ctxCounts = CTX.map(l => ({ l, n: cardsIn(l.id).length }));
  const totalNext = ctxCounts.reduce((s,x)=>s+x.n, 0);

  // ---- Health bar ----
  let wipHtml = ctxCounts.map(({l,n}) => {
    if (l.wip == null) return '<span class="wip none"><span class="dot"></span><b>'+l.name+'</b> '+n+'</span>';
    const over = n > l.wip;
    return '<span class="wip '+(over?'over':'ok')+'"><span class="dot"></span><b>'+l.name+'</b> '+n+'/'+l.wip+(over?' ⚠':'')+'</span>';
  }).join("");

  let health = '<div class="health"><div class="health-top">'
    + '<div class="stat"><span class="num'+(inboxCards.length?' alert':'')+'">'+inboxCards.length+'</span><span class="lbl">Inbox to clarify</span></div>'
    + '<div class="stat"><span class="num">'+totalNext+'</span><span class="lbl">Next actions</span></div>'
    + '<div class="stat"><span class="num">'+waitingCards.length+'</span><span class="lbl">Waiting for</span></div>'
    + '<div class="stat"><span class="num">'+rockCards.length+'</span><span class="lbl">Big rocks</span></div>'
    + '<div class="stat click" onclick="toggleSnooze()" title="Click to '+(SNOOZE_OPEN?'collapse':'expand')+'">'
    +   '<span class="num">'+(SNOOZED === null ? '…' : SNOOZED.length)+'</span>'
    +   '<span class="lbl">Snoozed '+(SNOOZE_OPEN?'▴':'▾')+'</span></div>'
    + '</div><div class="wip-row">'+wipHtml+'</div></div>';

  // ---- Snoozed panel (expanded via the health-bar stat) ----
  let snoozePanel = "";
  if (SNOOZE_OPEN){
    let rows;
    if (SNOOZED === null){
      rows = '<div class="empty">loading…</div>';
    } else if (!SNOOZED.length){
      rows = '<div class="empty">nothing snoozed</div>';
    } else {
      rows = SNOOZED.map(s => {
        const link = (s.url && /^https?:\/\//i.test(s.url))
          ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">'+esc(s.name)+'</a>'
          : esc(s.name);
        const home = LIST_NAMES[s.homeListId] || s.homeListAlias || "?";
        return '<div class="snz-row"><div><div class="ttl">'+link+'</div>'
          + '<div class="meta'+(s.overdueWake?' overdue':'')+'">'
          + (s.overdueWake ? 'overdue wake — was due ' : 'wakes ') + esc(fmtWake(s.wakeUp))
          + ' · → '+esc(home)+'</div></div>'
          + '<button class="btn done" data-card="'+s.id+'" onclick="onWake(this)">Wake now</button></div>';
      }).join("");
    }
    snoozePanel = '<div class="col" style="margin-bottom:16px;"><div class="col-head"><span class="name">Snoozed cards</span>'
      + '<span class="count">'+(SNOOZED ? SNOOZED.length : '…')+'</span></div>'+rows+'</div>';
  }

  // ---- Weekly review panel ----
  // Shows only what the daily board deliberately hides: the Could-do horizons
  // (which are not dashboard zones) and the waiting items that have gone stale.
  // Counts only, read-only — parking a card in a horizon stays a Trello action.
  let reviewPanel = '<div class="ov-panel rev'+(REVIEW_OPEN?'':' collapsed')+'"><div class="ov-panel-title click" onclick="toggleReview()">'
    + 'Weekly review <small>' + (REVIEW_OPEN ? 'horizons &amp; stale waiting ▴' : 'it’s ' + DAY_NAME + ' — open to check horizons ▾') + '</small></div>';
  if (REVIEW_OPEN){
    if (REVIEW === null){
      reviewPanel += '<div class="empty">loading…</div>';
    } else if (REVIEW.error){
      reviewPanel += '<div class="empty">couldn’t load the review pack: ' + esc(REVIEW.error) + '</div>';
    } else {
      const horizons = REVIEW.could_do || {};
      const hz = Object.keys(horizons).map(k =>
        '<span class="wip '+(horizons[k] ? 'none' : 'zero')+'"><b>'+esc(HORIZON_NAMES[k] || k)+'</b> '+horizons[k]+'</span>').join("");
      reviewPanel += '<div class="wip-row">'+(hz || '<span class="empty">no horizon lists</span>')+'</div>';
      const stale = (REVIEW.waiting && REVIEW.waiting.stale) || [];
      const staleDays = (REVIEW.waiting && REVIEW.waiting.staleDays) || 7;
      reviewPanel += '<div class="rev-sub">Waiting-for untouched '+staleDays+'+ days ('+stale.length+')</div>';
      reviewPanel += stale.length
        ? '<div class="cols">' + stale.map(s => {
            const link = (s.url && /^https?:\/\//i.test(s.url))
              ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>' : esc(s.name);
            const days = Math.floor((Date.now() - Date.parse(s.updated || "")) / 86400000);
            return '<div class="card"><div class="ttl">'+link+'</div>'
              + '<div class="badges"><span class="badge age drifting">stale '+(isNaN(days)?'?':days)+' days — chase or drop?</span></div></div>';
          }).join("") + '</div>'
        : '<div class="empty">clean week — nothing pending too long</div>';
    }
  }
  reviewPanel += '</div>';

  // ---- Quick capture ----
  const queued = queueRead().length;
  let capture = '<div class="capture">'
    + '<input id="capInput" type="text" placeholder="Quick capture → Inbox…" onkeydown="if(event.key===\'Enter\')onCapture()">'
    + '<button id="capBtn" onclick="onCapture()">Add</button></div>'
    + (queued ? '<div class="cap-queued">'+queued+' capture'+(queued>1?'s':'')+' waiting to sync — they’ll go in when you’re back online</div>' : '');

  // ---- List overview panel (count per list) ----
  let overview = '<div class="ov-panel"><div class="ov-panel-title">Cards per list</div><div class="overview">'
    + OVERVIEW.map(l => {
        const n = cardsIn(l.id).length;
        const over = (l.wip != null && n > l.wip) || (l.id === INBOX.id && n > 0);
        let cls = "ov"; if (n === 0) cls += " zero"; if (over) cls += " alert";
        return '<div class="'+cls+'"><span class="ov-num">'+n+'</span><span class="ov-name">'+esc(l.name)+'</span></div>';
      }).join("")
    + '</div></div>';

  // ---- Zone 2: next actions (with per-tag counts across context lists) ----
  const nextCards = CTX.reduce((a,l)=>a.concat(cardsIn(l.id)), []);
  const tagCount = { all: nextCards.length, personal: nextCards.filter(isPersonal).length };
  FILTER_LABELS.forEach(f => { tagCount[f.key] = nextCards.filter(c=>hasLabel(c,f.label)).length; });
  const chips = [["all","All"]].concat(FILTER_LABELS.map(f=>[f.key,f.label]), [["personal","Personal"]])
    .map(([k,lbl]) => '<span class="chip'+(FILTER===k?' active':'')+'" onclick="setFilter(\''+k+'\')">'+esc(lbl)+'<span class="chip-n">'+tagCount[k]+'</span></span>').join("");

  // Only reachable via ?board= pointing at a board that doesn't use the
  // "@context" convention. Say so rather than rendering an empty grid.
  let ctxCols = CTX.length ? "" : '<div class="empty">no @context lists on this board</div>';
  ctxCols += CTX.map(l => {
    const all = cardsIn(l.id);
    const shown = all.filter(passesFilter);
    const over = l.wip != null && all.length > l.wip;
    let body = shown.length
      ? shown.map(c => cardHtml(c, {age:"next"})).join("")
      : '<div class="empty">'+(all.length ? "nothing matches filter" : "clear")+'</div>';
    return '<div class="col"><div class="col-head"><span class="name">'+esc(l.name)+'</span>'
      + '<span class="count'+(over?' over':'')+'">'+all.length+(l.wip!=null?'/'+l.wip:'')+'</span></div>'
      + body + '</div>';
  }).join("");

  // ---- Zone 3: needs attention ----
  let waitingCol = '<div class="col"><div class="col-head"><span class="name">Waiting for…</span><span class="count">'+waitingCards.length+'</span></div>'
    + (waitingCards.length ? waitingCards.map(c=>cardHtml(c, {age:"waiting"})).join("") : '<div class="empty">nothing pending on others</div>') + '</div>';
  let inboxCol = '<div class="col"><div class="col-head"><span class="name">Inbox — clarify</span><span class="count'+(inboxCards.length?' over':'')+'">'+inboxCards.length+'</span></div>'
    + (inboxCards.length ? inboxCards.map(c=>cardHtml(c, {age:"inbox"})).join("") : '<div class="empty">inbox zero 🎉</div>') + '</div>';

  // ---- Zone 4: big rocks ----
  let rocksCol = rockCards.length
    ? '<div class="cols">' + rockCards.map(c=>cardHtml(c,{noActions:true, age:"rock"})).join("") + '</div>'
    : '<div class="empty">no big rocks listed</div>';

  document.getElementById("content").innerHTML =
      health
    + snoozePanel
    + capture
    + overview
    + reviewPanel
    + '<div class="zone-title">Next actions <small>by context · filter to focus</small></div>'
    + '<div class="filters">'+chips+'</div>'
    + '<div class="cols">'+ctxCols+'</div>'
    + '<div class="zone-title">Needs attention</div>'
    + '<div class="two">'+waitingCol+inboxCol+'</div>'
    + '<div class="zone-title">Rolling big rocks <small>your active projects — don’t let firefighting bury these</small></div>'
    + rocksCol;

  if (pendingCapture){
    const input = document.getElementById("capInput");
    input.value = pendingCapture;
    if (captureHadFocus){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
}

function setFilter(k){
  FILTER = k;
  try { localStorage.setItem("dann_dash_filter", k); } catch(e){}
  render();
}

function fmtWake(iso){
  try {
    return new Date(iso).toLocaleString("en-GB", { timeZone: "Europe/Copenhagen", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  } catch(e){ return iso.slice(0, 10); }
}

function toggleSnooze(){ SNOOZE_OPEN = !SNOOZE_OPEN; render(); }

function toggleReview(){
  REVIEW_OPEN = !REVIEW_OPEN;
  render();
  if (REVIEW_OPEN && REVIEW === null) loadReview();
}

// Lazy: /api/review is a second full board read, so it only runs when the panel
// is actually open. Failure leaves REVIEW null and the panel says so, rather
// than showing zeros that read as "nothing parked anywhere".
async function loadReview(){
  try {
    REVIEW = await api("/api/review");
  } catch(e){
    REVIEW = { error: e.message };
  }
  render();
}

// Fetched non-blocking after the board renders — the count fills in when ready.
async function loadSnoozed(){
  try {
    const r = await api("/api/snoozed");
    SNOOZED = (r && Array.isArray(r.snoozed)) ? r.snoozed : [];
  } catch(e){
    // Keep whatever we already had — a transient failure on a refresh must
    // not flip the stat to 0 / the panel to "nothing snoozed". v1.16.1 fix.
    SNOOZED = SNOOZED ?? [];
  }
  render();
}

async function onWake(btn){
  const id = btn.getAttribute("data-card");
  btn.disabled = true;
  try {
    await api("/api/wake", { method: "POST", body: JSON.stringify({ cardId: id }) });
  } catch(e){ btn.disabled = false; toast("Couldn’t wake: "+e.message); return; }
  // The card IS awake from here on — a failed board refresh must not read as
  // a wake failure (same rule as onCapture). v1.16.1 fix.
  SNOOZED = (SNOOZED || []).filter(s => s.id !== id);
  toast("Card is awake ✓");
  render();
  try { CARDS = await loadCards(); } catch(e){ /* next refresh catches up */ }
  render();
}

async function onDone(btn){
  const id = btn.getAttribute("data-card");
  const card = CARDS.find(x=>x.id===id);
  const prevList = card ? card.idList : null;
  btn.disabled = true;
  try {
    // The server flips dueComplete (Butler triggers still fire) AND moves
    // the card to Done-do, so this update matches server state, not a guess.
    const res = await api("/api/done", { method: "POST", body: JSON.stringify({ cardId: id }) });
    // Re-find after the await: a concurrent refresh may have replaced CARDS,
    // and mutating the pre-await object would update a dead array. v1.16.1 fix.
    const cNow = CARDS.find(x=>x.id===id); if (cNow) cNow.idList = DONE.id;
    toast(res && res.warning ? res.warning : "Marked done ✓", prevList ? {
      label: "Undo",
      fn: async () => {
        try {
          await api("/api/undo-done", { method: "POST", body: JSON.stringify({ cardId: id, list: prevList }) });
          const c2 = CARDS.find(x=>x.id===id); if (c2){ c2.idList = prevList; c2.dueComplete = false; }
          toast("Restored");
          render();
        } catch(e){ toast("Undo failed: "+e.message); }
      }
    } : undefined);
    render();
  } catch(e){ btn.disabled = false; toast("Couldn’t mark done: "+e.message); }
}

async function onMove(sel){
  const id = sel.getAttribute("data-card");
  const dest = sel.value; if (!dest) return;
  const card = CARDS.find(x=>x.id===id);
  const prevList = card ? card.idList : null;
  sel.disabled = true;
  try {
    const res = await api("/api/move", { method: "POST", body: JSON.stringify({ cardId: id, list: dest }) });
    const cNow = CARDS.find(x=>x.id===id); if (cNow) cNow.idList = dest; // re-find post-await (see onDone)
    const t = MOVE_TARGETS.find(x=>x.id===dest);
    toast(res && res.warning ? res.warning : "Moved to "+(t?t.name:"list"), prevList ? {
      label: "Undo",
      fn: async () => {
        try {
          await api("/api/move", { method: "POST", body: JSON.stringify({ cardId: id, list: prevList }) });
          const c2 = CARDS.find(x=>x.id===id); if (c2) c2.idList = prevList;
          toast("Moved back");
          render();
        } catch(e){ toast("Undo failed: "+e.message); }
      }
    } : undefined);
    render();
  } catch(e){
    // Reset to the placeholder so re-picking the same destination re-fires
    // onchange — otherwise the natural retry is silently a no-op.
    sel.value = "";
    sel.disabled = false;
    toast("Move failed: "+e.message);
  }
}

// ---- Offline capture queue (v1.20.0) ----
// Capture is the one thing Dann does from a phone in a hotel or on a plane,
// and it is exactly where the network isn't. A dropped POST used to leave the
// text in the box and an error toast — recoverable, but only if he noticed
// before closing the tab.
//
// Queued ONLY when the browser knows it is offline. A request that failed
// while online may still have reached Trello, and re-sending it would create a
// duplicate card with nothing to detect it — /api/capture has no idempotency
// key. A silent duplicate is worse than an error message, so the online-failure
// path is left exactly as it was.
const CAPTURE_QUEUE_KEY = "dann_dash_capture_queue";
function queueRead(){ try { return JSON.parse(localStorage.getItem(CAPTURE_QUEUE_KEY) || "[]"); } catch(e){ return []; } }
function queueWrite(q){ try { localStorage.setItem(CAPTURE_QUEUE_KEY, JSON.stringify(q)); } catch(e){} }

let FLUSHING = false;
// Drain oldest-first, stopping at the first failure: capture order is the order
// the thoughts arrived, and a half-drained queue must keep the rest intact.
async function flushCaptureQueue(){
  if (FLUSHING || !queueRead().length) return 0;
  FLUSHING = true;
  let sent = 0;
  try {
    let q = queueRead();
    while (q.length){
      try {
        await api("/api/capture", { method: "POST", body: JSON.stringify({ name: q[0] }) });
      } catch(e){ break; }
      q.shift(); queueWrite(q); sent++;
    }
  } finally { FLUSHING = false; }
  return sent;
}

async function reloadAfterFlush(n){
  toast(n === 1 ? "Synced 1 offline capture" : "Synced "+n+" offline captures");
  try { CARDS = await loadCards(); } catch(e){}
  render();
}

// Coming back online is the moment the queue can move; the visibilitychange
// refresh below covers the case where the event never fires (tab restored on a
// different network).
window.addEventListener("online", () => {
  flushCaptureQueue().then(n => { if (n) reloadAfterFlush(n); });
});

async function onCapture(){
  const input = document.getElementById("capInput");
  const btn = document.getElementById("capBtn");
  const name = (input.value||"").trim();
  if (!name) return;
  btn.disabled = true; input.disabled = true;
  let created = null;
  try {
    created = await api("/api/capture", { method: "POST", body: JSON.stringify({ name: name }) });
  } catch(e){
    btn.disabled = false; input.disabled = false;
    if (navigator.onLine === false){
      const q = queueRead(); q.push(name); queueWrite(q);
      input.value = "";
      toast(q.length === 1 ? "Offline — saved, syncs when you’re back" : "Offline — "+q.length+" captures saved");
      render();
      return;
    }
    toast("Couldn’t add: "+e.message);
    return;
  }
  // The card exists in Trello from here on — never report failure below, or
  // a transient refresh error invites a duplicate re-submit.
  input.value = "";
  try {
    CARDS = await loadCards();
  } catch(e){
    if (created && created.card) CARDS.push({ ...created.card, idList: (created.card.listId != null ? created.card.listId : created.card.idList) });
  }
  btn.disabled = false; input.disabled = false;
  toast(created && created.warning ? created.warning : "Added to Inbox");
  render();
}

async function init(){
  try {
    CARDS = await loadCards();
    render();
    loadSnoozed(); // non-blocking; fills the Snoozed stat when ready
    if (REVIEW_OPEN) loadReview(); // Fridays: the panel is open, so fill it
    flushCaptureQueue().then(n => { if (n) reloadAfterFlush(n); });
  } catch(e){
    document.getElementById("content").innerHTML =
      '<div class="errbox">Couldn’t load your Trello board: '+esc(e.message)+'</div>';
  }
}
init();

// Refresh when the tab/app regains focus after a while — otherwise an
// overnight tab acts on a stale board. Throttled to once per minute. v1.16.0.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - LAST_LOAD > 60000){
    flushCaptureQueue().catch(()=>{});
    loadCards().then(cs => { CARDS = cs; render(); loadSnoozed(); }).catch(()=>{});
  }
});
</script>
